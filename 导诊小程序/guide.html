<style>
  body {
    font-family: Arial, sans-serif;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f5f5f5;
  }
  h1 {
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .option {
    width: 80%;
    max-width: 300px;
    padding: 1rem;
    margin: 0.5rem 0;
    background: #40d6c2;
    color: white;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .option:hover {
    background: #41c1f1;
  }
  .nav-buttons {
    margin-top: 1.5rem;
    display: flex;
    justify-content: space-between;
    width: 80%;
    max-width: 300px;
  }
  .nav-buttons button {
    padding: 0.8rem 1.5rem;
    background: #888;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .nav-buttons button:hover {
    background: #555;
  }
  #result {
    margin-top: 2rem;
    width: 90%;
    max-width: 350px;
    padding: 1rem;
    background: #fff7e6;
    border: 1px solid #ffc107;
    border-radius: 8px;
    min-height: 50px;
    font-size: 1rem;
    line-height: 1.5;
    word-break: break-word;
    display: none; /* 默认隐藏 */
  }
</style>
</head>

]

let currentId = 1;
let historyStack = [];
let selectedPath = [];

function showQuestion(id){
  const rows = table.filter(r => r.id === id);
  if(rows.length === 0) return;

  document.getElementById("question").style.display = "block";
  document.getElementById("options").style.display = "block";
  document.querySelector(".nav-buttons").style.display = "flex";
  document.getElementById("result").style.display = "none";

  document.getElementById("question").innerText = rows[0].question;
  const box = document.getElementById("options");
  box.innerHTML = "";

  rows.forEach(row => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = row.option;
    div.onclick = () => {
      historyStack.push(currentId);
      selectedPath.push(row.option);
      if(row.next_id){
        currentId = row.next_id;
        showQuestion(currentId);
      } else {
        // 隐藏问题和选项
        document.getElementById("question").style.display = "none";
        document.getElementById("options").style.display = "none";
        document.querySelector(".nav-buttons").style.display = "none";

        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";
        resultDiv.innerText = "问诊结束！完整选择路径：\n" + selectedPath.join(" → ");
      }
    };
    box.appendChild(div);
  });
}

// 上一步按钮
document.getElementById("prevBtn").onclick = () => {
  if(historyStack.length > 0){
    currentId = historyStack.pop();
    selectedPath.pop();
    showQuestion(currentId);
  } else {
    alert("已经是第一题");
  }
};

// 下一步按钮（自动跳第一条 next_id）
document.getElementById("nextBtn").onclick = () => {
  const rows = table.filter(r => r.id === currentId && r.next_id);
  if(rows.length > 0){
    historyStack.push(currentId);
    selectedPath.push(rows[0].option);
    currentId = rows[0].next_id;
    showQuestion(currentId);
  } else {
    alert("没有下一题");
  }
};
// 如果选项多于4个，显示三列
  if(rows.length > 4){
    box.style.gridTemplateColumns = "repeat(3, 1fr)";
  } else {
    box.style.gridTemplateColumns = "1fr";
  }

  rows.forEach(row => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = row.option;
    div.onclick = () => {
      if(row.next_id){
        showQuestion(row.next_id);
      } else {
        box.innerHTML = ""; // 清空选项
        resultDiv.innerText = "问诊结束，推荐结果：" + row.option;
      }
    }
    box.appendChild(div);
  });
}
// 初始化显示第一题
showQuestion(currentId);
